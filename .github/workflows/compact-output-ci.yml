name: Compact tool output regression

on:
  push:
    branches: [feat/compact-output-20261010]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-compact:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Run compact output tests
        shell: pwsh
        run: cargo test --locked compact_output_tests
      - name: Build release executable
        shell: pwsh
        run: cargo build --release --locked
      - name: Verify release build and hash
        shell: pwsh
        run: |
          if (-not (Test-Path target/release/catdesk.exe)) { throw 'Missing catdesk.exe' }
          Get-FileHash target/release/catdesk.exe -Algorithm SHA256 | Format-List
          git rev-parse HEAD | Set-Content target/release/source-commit.txt
      - name: Upload verified executable
        uses: actions/upload-artifact@v4
        with:
          name: catdesk-compact-windows-${{ github.sha }}
          path: |
            target/release/catdesk.exe
            target/release/source-commit.txt
          if-no-files-found: error
          retention-days: 7
